<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cranny · 墙角的电子游戏</title>
<meta name="description" content="我自己写的小游戏，都开源、都能离线玩。点开即玩，也能下到电脑和手机上。">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="cranny · 墙角的电子游戏">
<meta property="og:description" content="我自己写的小游戏，都开源、都能离线玩。点开即玩，也能下到电脑和手机上。">
<meta property="og:image" content="images/twitter-opengraph.png">
<meta property="og:url" content="https://cranny.bbrrot.com/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://github.io">
<link rel="stylesheet" href="assets/styles/index.css">
</head>
<body>

<!-- 顶部加载进度条 -->
<div class="loadbar" id="loadbar" aria-hidden="true"></div>

<!-- ===================== 顶栏（玻璃层） ===================== -->
<header class="topbar" id="topbar">
  <div class="topbar__inner">
    <a class="brand" href="./">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V9a5 5 0 0 1 5-5h11"/>
          <path d="M20 4v7a5 5 0 0 1-5 5H9"/>
        </svg>
      </span>
      <span class="brand__text">cranny</span>
    </a>

    <div class="topbar__actions">
      <button class="icon-btn" id="themeToggle" type="button"
              aria-label="切换深浅色模式" title="切换主题"></button>
    </div>
  </div>
</header>

<!-- ===================== 主内容 ===================== -->
<main class="main container">

  <!-- 站名只在顶栏出现一次；这里给一句话说明它是干什么的 -->
  <section class="hero">
    <p class="hero__title">墙角的电子游戏</p>
    <p class="hero__sub">开源的、能白嫖的、点开就能玩的。慢慢挑，不着急。</p>
    <p class="hero__count" id="pageSub">正在加载…</p>
    <div class="hero__search" id="searchWrap">
      <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input class="search__input" id="search" type="search"
             placeholder="搜一个游戏名" autocomplete="off" spellcheck="false"
             aria-label="搜索游戏">
      <button class="search__clear" id="searchClear" type="button" aria-label="清除搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- 分段控件 -->
  <div class="segmented" role="tablist" aria-label="游戏类型切换">
    <button class="segmented__item" role="tab" data-tab="all"   aria-selected="true"  type="button">全部</button>
    <button class="segmented__item" role="tab" data-tab="web"   aria-selected="false" type="button">网页游戏</button>
    <button class="segmented__item" role="tab" data-tab="local" aria-selected="false" type="button">需下载</button>
    <button class="segmented__item" role="tab" data-tab="fav"   aria-selected="false" type="button">收藏</button>
  </div>

  <!-- 分类胶囊 -->
  <div class="pills" id="pills" role="tablist" aria-label="分类筛选"></div>

  <!-- 次级筛选：能否站内直接玩 + 许可证。做折叠是因为 20 个分类已经够长了 -->
  <div class="facets" id="facets">
    <button class="facets__toggle" id="facetsToggle" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h16M7 12h10M10 18h4"/>
      </svg>
      <span>细筛</span>
      <span class="facets__badge" id="facetsBadge" hidden>0</span>
    </button>

    <div class="facets__body" id="facetsBody" hidden>
      <div class="facet">
        <p class="facet__label">怎么玩</p>
        <div class="facet__opts" id="embedOpts" role="group" aria-label="运行方式筛选"></div>
      </div>
      <div class="facet">
        <p class="facet__label">许可证</p>
        <div class="facet__opts" id="licenseOpts" role="group" aria-label="许可证筛选"></div>
      </div>
      <button class="facets__reset" id="facetsReset" type="button" hidden>清空细筛</button>
    </div>
  </div>

  <!-- 精选 -->
  <section class="section" id="featuredSection" hidden>
    <div class="section__head">
      <h2 class="section__title">精选</h2>
      <span class="section__count" id="featuredCount"></span>
    </div>
    <div class="row-wrap">
      <div class="row" id="featuredRow"></div>
    </div>
  </section>

  <!-- 最近游玩 -->
  <section class="section" id="recentSection" hidden>
    <div class="section__head">
      <h2 class="section__title">最近游玩</h2>
      <button class="section__more" id="recentClear" type="button">清空</button>
    </div>
    <div class="row" id="recentRow"></div>
  </section>

  <!-- 全部游戏 -->
  <section class="section">
    <div class="section__head">
      <h2 class="section__title" id="gridTitle">全部游戏</h2>
      <span class="section__count" id="gridCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div id="emptyState"></div>
  </section>

</main>

<footer class="footer">
  <div>游戏都归原作者所有 · 这里只是我个人攒着玩的地方，不托管也不分发游戏本体</div>
  <div>
    <a href="https://github.com/astrnox" target="_blank" rel="noopener noreferrer">github.com/astrnox</a>
    <span class="footer__sep">·</span>
    <a href="data/games.json" target="_blank">games.json</a>
  </div>
</footer>

<script type="module" src="src/app.js"></script>
</body>
</html>
